<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detalle de la película</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#111;
color:white;
padding-bottom:30px;
}

header{
position:sticky;
top:0;
background:#181818;
padding:15px;
display:flex;
align-items:center;
gap:15px;
z-index:100;
}

header button{
background:#ff3d00;
border:none;
padding:10px 15px;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;
}

header h2{
font-size:22px;
}

#poster{
width:100%;
max-height:500px;
object-fit:cover;
display:block;
}

.info{
padding:20px;
}

h1{
margin-bottom:10px;
font-size:32px;
}

#year{
color:#bbb;
margin-bottom:10px;
font-size:18px;
}

#rating{
font-size:20px;
color:gold;
margin-bottom:20px;
}

#genres{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
}

.genero{
background:#ff3d00;
padding:8px 15px;
border-radius:20px;
font-size:14px;
}

#overview{
line-height:1.7;
font-size:17px;
color:#ddd;
margin-bottom:30px;
}

#cast{
display:flex;
overflow-x:auto;
gap:15px;
padding-bottom:15px;
}

.actor{
min-width:120px;
text-align:center;
}

.actor img{
width:100px;
height:150px;
border-radius:10px;
object-fit:cover;
background:#333;
margin-bottom:8px;
}

.footer{
text-align:center;
padding:25px;
margin-top:40px;
border-top:1px solid #333;
background:#111;
color:#aaa;
font-size:14px;
line-height:1.6;
}

</style>

</head>

<body>

<header>
<button onclick="history.back()">←</button>
<h2>Detalle</h2>
</header>

<img id="poster" alt="Poster">

<div class="info">

<h1 id="title"></h1>

<div id="year"></div>

<div id="rating"></div>

<div id="genres"></div>

<p id="overview"></p>

<h2>Reparto</h2>

<div id="cast"></div>

</div>

<footer class="footer">
© 2026 Todos los derechos reservados.
<br>
Desarrollado por Matías Andino.
</footer>

<script>

const API_KEY = "TU_API_KEY";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function cargar(){

try{

const pelicula = await fetch(
`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=es-ES`
);

const data = await pelicula.json();

document.getElementById("poster").src =
data.backdrop_path
? "https://image.tmdb.org/t/p/original" + data.backdrop_path
: "https://via.placeholder.com/1200x675?text=Sin+Imagen";

document.getElementById("title").textContent = data.title;

document.getElementById("year").textContent =
data.release_date || "Sin fecha";

document.getElementById("rating").textContent =
"⭐ " + data.vote_average;

document.getElementById("overview").textContent =
data.overview || "Sin descripción.";

const genres = document.getElementById("genres");
genres.innerHTML = "";

data.genres.forEach(g => {
genres.innerHTML += `<div class="genero">${g.name}</div>`;
});

const creditos = await fetch(
`https://api.themoviedb.org/3/movie/${id}/credits?api_key=${API_KEY}&language=es-ES`
);

const castData = await creditos.json();

const cast = document.getElementById("cast");
cast.innerHTML = "";

castData.cast.slice(0,10).forEach(actor => {

const foto = actor.profile_path
? "https://image.tmdb.org/t/p/w300" + actor.profile_path
: "https://via.placeholder.com/100x150?text=Sin+Foto";

cast.innerHTML += `
<div class="actor">
<img src="${foto}" alt="${actor.name}">
<div>${actor.name}</div>
</div>
`;

});

}catch(error){

console.error(error);

document.body.innerHTML = `
<h2 style="text-align:center;padding:40px;">
Error al cargar la película.
</h2>
`;

}

}

cargar();

</script>

</body>
</html>
