<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Detalle</title>

<link rel="stylesheet" href="estilos.css">

<style>

body{
margin:0;
background:#111;
font-family:Arial,Helvetica,sans-serif;
color:white;
}

header{

position:fixed;
top:0;
left:0;
right:0;

padding:15px;

background:#181818;

display:flex;
align-items:center;
gap:15px;

z-index:100;

}

header button{

background:#ff3d00;

border:none;

padding:10px 15px;

border-radius:8px;

color:white;

font-size:18px;

cursor:pointer;

}

#poster{

width:100%;

height:500px;

object-fit:cover;

}

.info{

padding:20px;

}

h1{

margin:10px 0;

font-size:30px;

}

#year{

color:#bbb;

font-size:18px;

}

#rating{

margin-top:10px;

font-size:20px;

color:gold;

}

#genres{

margin-top:15px;

display:flex;

flex-wrap:wrap;

gap:10px;

}

.genero{

background:#ff3d00;

padding:8px 15px;

border-radius:20px;

font-size:14px;

}

#overview{

margin-top:25px;

line-height:1.7;

font-size:17px;

color:#ddd;

}

#cast{

margin-top:30px;

display:flex;

overflow:auto;

gap:15px;

padding-bottom:20px;

}

.actor{

min-width:120px;

text-align:center;

}

.actor img{

width:100px;

height:150px;

object-fit:cover;

border-radius:10px;

}

</style>

</head>

<body>

<header>

<button onclick="history.back()">

←

</button>

<h2>Detalle</h2>

</header>

<img id="poster">

<div class="info">

<h1 id="title"></h1>

<div id="year"></div>

<div id="rating"></div>

<div id="genres"></div>

<p id="overview"></p>

<h2>Reparto</h2>

<div id="cast"></div>

</div>

<script>

const API_KEY = "TU_API_KEY";

const params=new URLSearchParams(location.search);

const id=params.get("id");

async function cargar(){

const pelicula=await fetch(

`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=es-ES`

);

const data=await pelicula.json();

poster.src="https://image.tmdb.org/t/p/original"+data.backdrop_path;

title.innerText=data.title;

year.innerText=data.release_date;

rating.innerText="⭐ "+data.vote_average;

overview.innerText=data.overview;

genres.innerHTML="";

data.genres.forEach(g=>{

genres.innerHTML+=

`<div class="genero">${g.name}</div>`;

});

const creditos=await fetch(

`https://api.themoviedb.org/3/movie/${id}/credits?api_key=${API_KEY}`

);

const castData=await creditos.json();

cast.innerHTML="";

castData.cast.slice(0,10).forEach(a=>{

cast.innerHTML+=`

<div class="actor">

<img src="https://image.tmdb.org/t/p/w300${a.profile_path}">

<div>${a.name}</div>

</div>

`;

});

}

cargar();

</script>

</body>
</html>
